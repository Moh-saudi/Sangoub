    <script>
      (function() {
        var recoveryKey = 'sangoub:module_recovery';
        function recover() {
          try {
            var last = parseInt(sessionStorage.getItem(recoveryKey) || '0', 10);
            var now = Date.now();
            if (now - last < 5000) return;
            sessionStorage.setItem(recoveryKey, String(now));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            var cleanUrl = window.location.href.split('?')[0];
            window.location.replace(cleanUrl + '?t=' + now);
          } catch (e) {
            window.location.reload();
          }
        }
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.target && e.target.src))) || '';
          if (typeof msg === 'string' && (
            msg.indexOf('Failed to load module script') !== -1 ||
            msg.indexOf('text/html') !== -1 ||
            msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1
          )) {
            recover();
          }
        }, true);
        window.addEventListener('vite:preloadError', function(e) {
          e.preventDefault();
          recover();
        });
      })();
    </script>
