name: capital_talabat_app
description: "طلبات الحي الحكومي بالعاصمة الإدارية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Firebase Core & Auth ──────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.3.0

  # ── State Management ──────────────────────────────────
  provider: ^6.1.4
  shared_preferences: ^2.5.3

  # ── Navigation ────────────────────────────────────────
  go_router: ^15.1.2

  # ── UI & Design ───────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0
  flutter_local_notifications: ^18.0.1

  # ── Networking ────────────────────────────────────────
  http: ^1.4.0

  # ── Utilities ─────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  permission_handler: ^12.0.0+1
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.0
  timeago: ^3.7.0
  geolocator: ^14.0.2

  # ── خرائط حقيقية مجانية (OpenStreetMap - بلا مفاتيح API) ────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/payment/
    - assets/animations/
