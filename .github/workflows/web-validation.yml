name: Web and Firebase validation
on:
  pull_request:
  push:
    branches: [main, feature/real-orders-auth-maps, feature/admin-web-only]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run test:commerce-services
      - run: npm run test:native-api
      - run: npm run test:compiled-api
        env:
          NODE_OPTIONS: --no-experimental-require-module
      - run: npm run build
      - run: npm run test:auth
      - run: npm run test:operations
      - run: npm run test:rules
      - run: npm run test:web-checkout
      - run: npm run test:commerce-integration
      - run: npx playwright install --with-deps chromium
      - run: node tests/pwa-build.browser.mjs
      - run: npm run test:admin-web
      - run: npm run test:shop-web
      - run: npm run test:storefront-auth
      - run: npm run test:preload-recovery
