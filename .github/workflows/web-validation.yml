name: Web and Firebase validation
on:
  pull_request:
  push:
    branches: [main, feature/osm-tracking]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: demo-capital-talabat
      VITE_FIREBASE_PROJECT_ID: demo-capital-talabat
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-capital-talabat.invalid
      VITE_FIREBASE_STORAGE_BUCKET: demo-capital-talabat.invalid
      VITE_FIREBASE_DATABASE_ID: (default)
      VITE_USE_FIREBASE_EMULATORS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:server
      - run: npm test
      - run: npm run test:commerce-services
      - run: npm run test:portal-services
      - run: npm run test:account-validation
      - run: npm run test:native-api
      - run: npm run test:compiled-api
        env:
          NODE_OPTIONS: --no-experimental-require-module
      - run: npm run build
      - run: npm run test:auth
      - run: npm run test:operations
      - run: node scripts/check-rules-ci.mjs
      - run: npm run test:web-checkout
      - run: npm run test:commerce-integration
      - run: npx playwright install --with-deps chromium
      - name: Use installed Playwright Chromium
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + chromium.executablePath() + '\n');
          NODE
      - run: npm run test:tracking-map
      - run: node tests/pwa-build.browser.mjs
      - run: npm run test:portal-regression
      - run: npm run test:admin-web
      - run: npm run test:shop-web
      - run: npm run test:storefront-auth
      - run: npm run test:preload-recovery
