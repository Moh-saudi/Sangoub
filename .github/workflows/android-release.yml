name: Build Web & Signed Android Mobile App (APK & Google Play AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Build Web + Sync Capacitor Android
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Setup Java JDK 17 for Android Gradle Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Restore stable Android signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: ./android/app
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.keystore
          chmod 600 release-key.keystore

      - name: Signing not configured
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo '::notice::Android release skipped. Configure the stable signing key in GitHub Secrets.'

      - name: Build Signed Android APK & Google Play App Bundle (.aab)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload Signed Google Play App Bundle (.aab) & APK Artifacts
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: capital-talabat-android-google-play-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            firebase-applet-config.json
            firestore.rules
