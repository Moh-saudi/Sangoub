name: Build Web & Signed Android Mobile App (APK & Google Play AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Build Web + Sync Capacitor Android
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Setup Java JDK 21 for Android Gradle Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Release Signing Keystore
        working-directory: ./android/app
        run: |
          if [ ! -f release-key.keystore ]; then
            keytool -genkeypair -v \
              -keystore release-key.keystore \
              -alias capital-talabat-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass CapitalTalabat2026 \
              -keypass CapitalTalabat2026 \
              -dname "CN=Capital Talabat, OU=Government District, O=New Administrative Capital, L=Cairo, S=Cairo, C=EG"
          fi

      - name: Build Signed Android APK & Google Play App Bundle (.aab)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload Signed Google Play App Bundle (.aab) & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capital-talabat-android-google-play-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/release-key.keystore
            firebase-applet-config.json
            firestore.rules
