name: Flutter contract validation
on:
  pull_request:
    paths: ['mobile_app/**', '.github/workflows/flutter-validation.yml']
  push:
    branches: [main]
    paths: ['mobile_app/**', '.github/workflows/flutter-validation.yml']
permissions:
  contents: read
jobs:
  validate-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
